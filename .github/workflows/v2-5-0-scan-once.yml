name: v2.5.0 one-time live market scan

on:
  push:
    branches: [main]

jobs:
  scan:
    if: contains(github.event.head_commit.message, '[run-v2.5.0-once]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v2.5.0 source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run one-time v2.5.0 scan
        env:
          PYTHONUNBUFFERED: "1"
        run: python scan_once_v2_5_0.py
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v25-scan-${{ github.run_number }}
          path: |
            v25_scan_top20.csv
            v25_scan_deep_scores.csv
            v25_scan_meta.json
          if-no-files-found: warn
